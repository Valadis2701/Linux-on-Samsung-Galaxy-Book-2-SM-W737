# SM-W737: эквалайзер динамика (сгенерировано ~/eq_tune.py, правки затрутся).
#
# В Windows тембр делали ACDB-калибровка и WDSP (qcauddev850.sys +
# qcwdsp850.mbn), которые mainline Linux загрузить не может, а Dolby-профиль
# имеет graphic-equalizer выключенным. Поэтому тракт звучит ярче, и ВЧ
# подрезаются здесь.
#
# Цепочка: low-shelf -> high-shelf -> peak 6.5k -> peak 10k

context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Book2 Speaker EQ"
        media.name       = "Book2 Speaker EQ"
        filter.graph = {
            nodes = [
                { type = builtin label = bq_lowshelf name = ls
                  control = { "Freq" = 150.0 "Q" = 0.70 "Gain" = 0.0 } }
                { type = builtin label = bq_highshelf name = hs
                  control = { "Freq" = 3500.0 "Q" = 0.70 "Gain" = -5.0 } }
                { type = builtin label = bq_peaking name = pk1
                  control = { "Freq" = 6500.0 "Q" = 1.20 "Gain" = -3.0 } }
                { type = builtin label = bq_peaking name = pk2
                  control = { "Freq" = 10000.0 "Q" = 1.00 "Gain" = -2.0 } }
            ]
            links = [
                { output = "ls:Out"  input = "hs:In" }
                { output = "hs:Out"  input = "pk1:In" }
                { output = "pk1:Out" input = "pk2:In" }
            ]
        }
        audio.channels = 2
        audio.position = [ FL FR ]
        capture.props = {
            node.name    = "effect_input.book2_eq"
            node.passive = true
            media.class  = Audio/Sink
        }
        playback.props = {
            node.name   = "effect_output.book2_eq"
            node.target = "alsa_output.platform-sound.HiFi__Speaker__sink"
        }
    }
}
]
