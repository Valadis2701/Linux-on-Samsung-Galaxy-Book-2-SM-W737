# SM-W737 (Samsung Galaxy Book2): WCD9340 codec + 2x WSA8815 amplifiers.
#
# Playback is MultiMedia1 (hw:0,0), capture is MultiMedia2 (hw:0,1); the SLIMBUS_0_RX link is
# a DPCM backend, so playback needs the mixer route below before the PCM can be
# opened ("no backend DAIs enabled for MultiMedia1" otherwise).
#
# Route: ADSP -> SLIMBUS_0_RX -> WCD9340 SLIM RX0/RX1 -> RX INT7/RX INT8 ->
#        SPK1/SPK2 OUT -> WSA8815 analog in -> speaker.

SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT7_1 MIX1 INP0' RX0"
		cset "name='RX INT8_1 MIX1 INP0' RX1"
		cset "name='RX INT7_1 INTERP' 'RX INT7_1 MIX1'"
		cset "name='RX INT8_1 INTERP' 'RX INT8_1 MIX1'"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrLeft PA Volume' 9"
		cset "name='SpkrRight PA Volume' 9"
		cset "name='RX7 Digital Volume' 84"
		cset "name='RX8 Digital Volume' 84"
	]

	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
# PlaybackVolume is intentionally not declared: the codec exposes
# separate mono controls per speaker (RX7/RX8). Mapping only RX7
# made the left channel louder than the right.
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	# Built-in digital mics, stereo on MultiMedia2 (hw:0,1):
	#   DMIC0 -> DEC0 -> SLIM TX0 (left)
	#   DMIC2 -> DEC1 -> SLIM TX1 (right)
	# -> SLIMBUS_0_TX -> MultiMedia2. DMIC1 and DMIC3 carry nearly the same
	# signal as DMIC0 and DMIC2 (paired mics); DMIC4/5 and the AMIC inputs
	# are not connected.
	#
	# Trap: SLIM TX1 recorded alone (mono) reads ~32 dB low, which looks like
	# a dead second mic; in a 2-channel stream it is at full level.
	EnableSequence [
		cset "name='ADC MUX0' DMIC"
		cset "name='ADC MUX1' DMIC"
		cset "name='DMIC MUX0' DMIC0"
		cset "name='DMIC MUX1' DMIC2"
		cset "name='DEC0 Volume' 84"
		cset "name='DEC1 Volume' 84"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='CDC_IF TX1 MUX' DEC1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='AIF1_CAP Mixer SLIM TX1' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='CDC_IF TX1 MUX' ZERO"
		cset "name='CDC_IF TX0 MUX' ZERO"
		cset "name='DMIC MUX1' ZERO"
		cset "name='DMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}
